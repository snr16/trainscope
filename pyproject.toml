[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trainscope"
version = "0.1.0"
description = "AI training-run debugger: telemetry SDK, detectors, and an MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["numpy>=1.24", "httpx>=0.27", "psutil>=5.9"]

[project.optional-dependencies]
torch = ["torch>=2.1"]
server = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.5", "duckdb>=1.0", "pandas>=2.0", "pyyaml>=6"]
postgres = ["psycopg[binary]>=3.1", "psycopg-pool>=3.2"]
mcp = ["mcp>=2.0", "duckdb>=1.0", "pandas>=2.0", "pyyaml>=6"]
bench = ["pyyaml>=6", "torch>=2.1"]
eval = ["anthropic>=0.40", "mcp>=2.0", "pyyaml>=6"]
gpu = ["nvidia-ml-py>=12"]
hf = ["transformers>=4.40", "accelerate>=0.26"]
dev = ["pytest>=8", "ruff>=0.5", "mypy>=1.10", "pyyaml>=6"]

[project.scripts]
trainscope-server = "trainscope_server.app:main"
trainscope-mcp = "trainscope_mcp.server:main"
trainscope = "trainscope_server.commands.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
trainscope_server = ["db/*.sql", "ui/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long-running tests (training runs, reliability)"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = false
