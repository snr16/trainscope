# docker compose up  ->  TimescaleDB + ingestion API (:8765) + MCP server over streamable HTTP (:8766)
services:
  timescaledb:
    image: timescale/timescaledb:2.17.2-pg16
    environment:
      POSTGRES_USER: trainscope
      POSTGRES_PASSWORD: trainscope
      POSTGRES_DB: trainscope
    volumes: [tsdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trainscope"]
      interval: 5s
      retries: 20

  ingest:
    build: .
    environment:
      TRAINSCOPE_DB: postgresql://trainscope:trainscope@timescaledb:5432/trainscope
      TRAINSCOPE_TOKENS: ${TRAINSCOPE_TOKENS:-}
    ports: ["8765:8765"]
    depends_on:
      timescaledb: {condition: service_healthy}

  mcp:
    build: .
    command: ["trainscope-mcp", "--http", "--host", "0.0.0.0", "--port", "8766"]
    environment:
      TRAINSCOPE_DB: postgresql://trainscope:trainscope@timescaledb:5432/trainscope
      TRAINSCOPE_MCP_TOKEN: ${TRAINSCOPE_MCP_TOKEN:-}
    ports: ["8766:8766"]
    healthcheck:  # the image default probes the ingest port; the MCP server listens on 8766
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8766), 2)"]
      interval: 10s
    depends_on:
      timescaledb: {condition: service_healthy}

volumes:
  tsdata:
